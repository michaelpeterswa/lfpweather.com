---
name: Release Version

on: # yamllint disable-line rule:truthy
  push:
    branches:
      - main

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  release:
    name: "Release to GitHub"
    runs-on: ubuntu-latest
    # A tag that does not compile is worse than no tag: upload_image.yml builds
    # and pushes the image straight from the release. If verify fails here, the
    # version is not lost -- the next push to main re-runs semantic-release over
    # the same commits and cuts the release then.
    needs: verify
    steps:
      - name: Checkout repo
        uses: actions/checkout@v3

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: lts/*

      - name: Install Semantic Release and Plugins
        run: |
          mkdir -p /tmp/semantic-release
          cd /tmp/semantic-release && npm install --legacy-peer-deps \
            semantic-release@22.0.12 \
            conventional-changelog-conventionalcommits@6

      - name: Release Version
        env:
          GITHUB_TOKEN: ${{ secrets.GH_RELEASE_PAT }}
        run: /tmp/semantic-release/node_modules/.bin/semantic-release
