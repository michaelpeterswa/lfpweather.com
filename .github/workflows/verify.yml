---
# The gate every other workflow depends on. Called from pull_request.yml for
# every PR and from push_main.yml before semantic-release cuts a tag, so a tree
# that does not build can never reach a published image.
#
# Can also be run by hand from the Actions tab.
name: Verify

on: # yamllint disable-line rule:truthy
  workflow_call:
  workflow_dispatch:

jobs:
  verify:
    name: lint, typecheck, test, build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Vitest is a Node CLI, so Node is needed even though Bun runs everything
      # else. Also gives npm, which installs Bun below.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up Bun
        # The same Bun the image is built on, read from the Dockerfile so CI and
        # the release image cannot drift apart. Installed with npm because that
        # is how the rest of these workflows pull their tooling.
        run: |
          image=$(grep -m1 '^FROM oven/bun:' Dockerfile | awk '{print $2}')
          tag=${image##*:}
          if [ -z "$tag" ]; then
            echo "could not read the bun tag from the Dockerfile" >&2
            exit 1
          fi
          npm install --global "bun@${tag}"
          bun --version

      - name: Cache dependencies
        uses: actions/cache@v4
        with:
          path: node_modules
          # Restored only for an unchanged lockfile, so a dependency bump
          # always installs clean instead of layering onto a stale tree.
          key: ${{ runner.os }}-nm-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-nm-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      # No env is needed: every page is dynamic, so nothing is fetched here.
      - name: Build
        run: bun run build
